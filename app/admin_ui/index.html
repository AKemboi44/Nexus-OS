<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Nexus metrics</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="topbar">
    <h1>Nexus metrics</h1>
    <div class="controls" id="controls" hidden>
      <span class="mode-badge" id="modeBadge" role="status" hidden><span class="dot" aria-hidden="true"></span><span id="modeText"></span></span>
      <div class="segmented" role="group" aria-label="Time window" id="windowPicker">
        <button type="button" data-days="7" aria-pressed="false">7 days</button>
        <button type="button" data-days="30" aria-pressed="true">30 days</button>
        <button type="button" data-days="90" aria-pressed="false">90 days</button>
      </div>
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="signOut">Sign out</button>
    </div>
  </header>

  <section class="login" id="login">
    <form id="loginForm">
      <label for="emailInput">Email</label>
      <input id="emailInput" type="email" autocomplete="username" required>
      <label for="passwordInput">Password</label>
      <input id="passwordInput" type="password" autocomplete="current-password" required>
      <button type="submit" id="loginSubmit">Sign in</button>
      <button type="button" class="link" id="useTokenBtn">Use admin token instead</button>
    </form>
    <form id="mfaForm" hidden>
      <p id="mfaPrompt"></p>
      <img id="mfaQr" alt="Authenticator app QR code" width="180" height="180" hidden>
      <p class="secret" id="mfaSecret" hidden></p>
      <label for="mfaCode">6-digit code</label>
      <input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
      <button type="submit" id="mfaSubmit">Verify</button>
    </form>
    <form id="tokenForm" hidden>
      <label for="tokenInput">Admin token</label>
      <input id="tokenInput" type="password" autocomplete="off" required>
      <button type="submit">Open dashboard</button>
      <button type="button" class="link" id="usePasswordBtn">Sign in with email instead</button>
    </form>
    <p class="message" id="loginMessage" role="alert"></p>
  </section>

  <p class="notice warning" id="modeNotice" role="alert" hidden></p>
  <main id="app" hidden>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <p class="notice" id="notice" role="status" hidden></p>
    <div id="view"></div>
  </main>

  <aside class="detail" id="detail" hidden aria-live="polite"></aside>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
